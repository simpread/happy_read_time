name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 凌晨任务：北京时间每天 06:00（UTC 前一天 22:00）
    - cron: '0 22 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 午间任务：北京时间每天 11:40（UTC 03:40）
    - cron: '40 3 * * *'
    # 晚间任务：北京时间每天 22:00（UTC 14:00）
    #- cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    timeout-minutes: 120  # 兜底：覆盖最坏情况（30分钟随机延迟+阅读+重试），卡死时避免默认 6 小时超时

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'  # 基于 requirements.txt 缓存依赖，加速安装

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        delay=$((RANDOM % 1801))
        echo "随机延迟 ${delay} 秒后启动..."
        sleep $delay
        python main.py

    - name: Update WXREAD_CURL_BASH secret
      if: always()
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        if [ -s new_curl.txt ]; then
          # 清理环境级同名 secret，保证仓库级 WXREAD_CURL_BASH 是唯一生效来源
          gh secret delete WXREAD_CURL_BASH --repo ${{ github.repository }} --env AutoRead || true
          gh secret set WXREAD_CURL_BASH --body "$(cat new_curl.txt)" --repo ${{ github.repository }}
          echo "WXREAD_CURL_BASH 已更新为最新 cookie"
        else
          echo "无新 cookie，跳过 secret 更新"
        fi

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
